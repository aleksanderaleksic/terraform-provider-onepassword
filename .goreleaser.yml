# Builds the Linux and Windows zips on an Ubuntu runner. The release job in
# .github/workflows/release.yml adds the darwin zips, checksums them, signs the
# checksums and publishes the release, so this config doesn't.
version: 2
builds:
  # CGO is required on Linux: the onepassword-sdk-go desktop app integration
  # doesn't compile without it.
  - id: linux-amd64
    env:
      - CGO_ENABLED=1
      - CC=gcc
    mod_timestamp: "{{ .CommitTimestamp }}"
    flags:
      - -trimpath
    ldflags:
      - "-s -w -X main.version={{ .Version }}"
    goos:
      - linux
    goarch:
      - amd64
    binary: "{{ .ProjectName }}_v{{ .Version }}"
  - id: linux-arm64
    env:
      - CGO_ENABLED=1
      - CC=aarch64-linux-gnu-gcc
    mod_timestamp: "{{ .CommitTimestamp }}"
    flags:
      - -trimpath
    ldflags:
      - "-s -w -X main.version={{ .Version }}"
    goos:
      - linux
    goarch:
      - arm64
    binary: "{{ .ProjectName }}_v{{ .Version }}"
  # The SDK uses the desktop app on Windows without CGO, so Windows cross-compiles.
  - id: windows
    env:
      - CGO_ENABLED=0
    mod_timestamp: "{{ .CommitTimestamp }}"
    flags:
      - -trimpath
    ldflags:
      - "-s -w -X main.version={{ .Version }}"
    goos:
      - windows
    goarch:
      - amd64
      - "386"
      - arm64
    binary: "{{ .ProjectName }}_v{{ .Version }}"
archives:
  - formats: ["zip"]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
checksum:
  disable: true
changelog:
  disable: true
