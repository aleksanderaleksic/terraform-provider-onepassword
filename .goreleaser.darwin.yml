# Builds the darwin zips on a macOS runner, since the onepassword-sdk-go desktop
# app integration needs CGO. The release job in .github/workflows/release.yml
# publishes them together with the zips from .goreleaser.yml.
version: 2
builds:
  - env:
      - CGO_ENABLED=1
    mod_timestamp: "{{ .CommitTimestamp }}"
    flags:
      - -trimpath
    ldflags:
      - "-s -w -X main.version={{ .Version }}"
    goos:
      - darwin
    goarch:
      - amd64
      - arm64
    binary: "{{ .ProjectName }}_v{{ .Version }}"
archives:
  - formats: ["zip"]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
checksum:
  disable: true
changelog:
  disable: true
