name: Release

# Pushing a v* tag builds the provider and publishes a GitHub release in the
# layout the OpenTofu and Terraform registries expect: one zip per platform, the
# registry manifest, a SHA256SUMS file and its detached GPG signature.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  # The onepassword-sdk-go desktop app integration needs CGO on Linux and macOS,
  # so darwin is built on a macOS runner and everything else on Ubuntu.
  build:
    strategy:
      matrix:
        include:
          # Pinned: ubuntu-26.04 x64 builds cgo code for x86-64-v3, breaking older CPUs
          - runner: ubuntu-24.04
            config: .goreleaser.yml
          - runner: macos-latest
            config: .goreleaser.darwin.yml
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install arm64 cross compiler
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build
        uses: step-security/goreleaser-action@e91207bb836a83eca7cb8b2e61024bcb6dc3c458 # v7.3.0
        with:
          args: release --clean --skip=publish --config ${{ matrix.config }}

      - name: Upload zips
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ runner.os }}
          path: dist/*.zip
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to create the release
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download zips
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      - name: Import GPG key
        id: import_gpg
        uses: step-security/ghaction-import-gpg@c0b4a334b9b72bfaaebec86ef022a78a5b17f828 # v7.0.0
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}

      - name: Checksum and sign
        env:
          GPG_FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}
        run: |
          prefix="terraform-provider-onepassword_${GITHUB_REF_NAME#v}"
          cp terraform-registry-manifest.json "dist/${prefix}_manifest.json"
          cd dist
          sha256sum -- *.zip "${prefix}_manifest.json" > "${prefix}_SHA256SUMS"
          gpg --batch --local-user "$GPG_FINGERPRINT" \
            --output "${prefix}_SHA256SUMS.sig" --detach-sign "${prefix}_SHA256SUMS"
          cat "${prefix}_SHA256SUMS"

      # Uploads to an existing release for the tag, so a release created by hand
      # or a re-run of this workflow gets the files too.
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes
          fi
